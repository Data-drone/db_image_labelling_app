command: ["python", "start.py"]
env:
  # Lakebase: use App "postgres" resource (PG* env). Do not auto-create a project in SDK.
  - name: LAKEBASE_AUTO_PROVISION
    value: 'false'
  - name: USE_LAKEBASE
    value: 'true'
  # Unity Catalog volume — resource keys must match resources/cv_explorer_app.yml
  - name: DEMO_VOLUME_PATH
    valueFrom: demo-volume
  - name: EXPORT_VOLUME_PATH
    valueFrom: export-volume
  # Finetuning job id
  - name: FINETUNE_DATABRICKS_JOB_ID
    valueFrom: app-finetune-job
  # Optional: PRE_ANNOTATE_ON_IMPORT=true, PRE_ANNOTATE_ON_IMPORT_MAX_SAMPLES=50
  # Optional: USE_SERVING_DATA_PLANE=true for generic adapter on dataplane
