command: ["python", "start.py"]
env:
  # Lakebase: connect via SDK to the dev project
  - name: LAKEBASE_AUTO_PROVISION
    value: 'false'
  - name: USE_LAKEBASE
    value: 'true'
  - name: LAKEBASE_PROJECT_ID
    value: 'cv-explorer-dev'
  # Apps postgres resource (same name as resources/cv_explorer_app.yml).
  # PGHOST/PGUSER/PGDATABASE are injected; this binding is required for OAuth.
  - name: LAKEBASE_ENDPOINT
    valueFrom: lakebase-db
  - name: LAKEBASE_SCHEMA
    value: 'cv_explorer_app'
  - name: LAKEBASE_MIGRATE_PUBLIC
    value: 'false'
  # Unity Catalog volumes
  - name: DEMO_VOLUME_PATH
    value: '/Volumes/brian_gen_ai/cv_explorer/demo_images'
  - name: EXPORT_VOLUME_PATH
    value: '/Volumes/brian_gen_ai/cv_explorer/exports'
  # Optional SQL warehouse for Delta table image sources (Create Project).
  # Leave empty until a warehouse id is bound in the Apps UI or bundle.
  - name: SQL_WAREHOUSE_ID
    value: ''
  - name: EMBEDDING_ENDPOINT
    valueFrom: embedding-endpoint
  # Finetuning job id
  - name: FINETUNE_DATABRICKS_JOB_ID
    value: '143235656478173'
  # Comma-separated Databricks IdP emails. Sentinel disables Admin mutations.
  - name: ADMIN_EMAILS
    value: '__disabled__'
