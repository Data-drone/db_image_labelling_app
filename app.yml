command: ["python", "start.py"]
env:
  # Manual Git deployments must attach App resources with these exact names.
  # Bundle deployments use resources/cv_explorer_app.yml instead.
  - name: LAKEBASE_AUTO_PROVISION
    value: 'false'
  - name: USE_LAKEBASE
    value: 'true'
  - name: LAKEBASE_PROJECT_ID
    value: 'cv-explorer-dev'
  # Apps postgres resource (same name as resources/cv_explorer_app.yml).
  # PGHOST/PGUSER/PGDATABASE are injected; this binding is required for OAuth.
  - name: LAKEBASE_ENDPOINT
    valueFrom: lakebase-db
  - name: LAKEBASE_SCHEMA
    value: 'cv_explorer_app'
  - name: LAKEBASE_MIGRATE_PUBLIC
    value: 'false'
  - name: DEMO_VOLUME_PATH
    valueFrom: demo-volume
  - name: EXPORT_VOLUME_PATH
    valueFrom: export-volume
  - name: SQL_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: SERVING_ENDPOINT
    valueFrom: serving-endpoint
  - name: SERVING_ENDPOINT_ADAPTER
    value: 'sam31'
  # Bounded scale-to-zero recovery. These are non-secret runtime settings.
  - name: SERVING_COLD_START_MAX_RETRIES
    value: '3'
  - name: SERVING_COLD_START_INITIAL_DELAY_S
    value: '5'
  - name: SERVING_COLD_START_MAX_DELAY_S
    value: '60'
  - name: SERVING_COLD_START_INTERACTIVE_BUDGET_S
    value: '45'
  - name: SERVING_COLD_START_JOB_BUDGET_S
    value: '900'
  - name: EMBEDDING_ENDPOINT
    valueFrom: embedding-endpoint
  - name: PRE_ANNOTATE_DATABRICKS_JOB_ID
    valueFrom: app-preannotate-job
  - name: FINETUNE_DATABRICKS_JOB_ID
    valueFrom: app-finetune-job
  # Comma-separated Databricks IdP emails. Sentinel disables Admin mutations.
  - name: ADMIN_EMAILS
    value: '__disabled__'
