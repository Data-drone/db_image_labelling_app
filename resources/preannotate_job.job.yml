# Databricks Job — async batch pre-annotation (see backend/routes/preannotate_runs.py).
# Deploy: databricks bundle deploy
# Set env PRE_ANNOTATE_DATABRICKS_JOB_ID in the app to this job's numeric id after deploy.
#
# Runs on serverless compute — the worker is pure I/O-bound Python (SDK calls
# to Model Serving + Lakebase writes), no Spark or GPU needed. Startup is
# seconds instead of minutes compared to a classic cluster.

resources:
  jobs:
    cv_explorer_preannotate:
      name: cv-explorer-preannotate-${bundle.target}
      parameters:
        - name: run_id
          default: "0"
        - name: sp_client_id
          default: ""
        - name: sp_client_secret
          default: ""
        - name: lakebase_project_id
          default: ${var.lakebase_project_id}
        - name: lakebase_endpoint
          default: ${var.lakebase_postgres_endpoint}
        - name: lakebase_database_name
          default: ${var.lakebase_database_name}
        - name: lakebase_schema_name
          default: ${var.lakebase_schema_name}
        - name: inference_adapter
          default: ${var.inference_adapter}
        - name: serving_cold_start_max_retries
          default: ${var.serving_cold_start_max_retries}
        - name: serving_cold_start_initial_delay_s
          default: ${var.serving_cold_start_initial_delay_s}
        - name: serving_cold_start_max_delay_s
          default: ${var.serving_cold_start_max_delay_s}
        - name: serving_cold_start_job_budget_s
          default: ${var.serving_cold_start_job_budget_s}
        - name: preannotate_job_batch_size
          default: ${var.preannotate_job_batch_size}
        - name: preannotate_max_consecutive_unavailable
          default: ${var.preannotate_max_consecutive_unavailable}
      tasks:
        - task_key: main
          environment_key: preann_env
          spark_python_task:
            python_file: ../scripts/preannotate_job.py
            parameters:
              - "{{job.parameters.run_id}}"
              - "{{job.parameters.sp_client_id}}"
              - "{{job.parameters.sp_client_secret}}"
              # Serverless tasks cannot set env vars; the entrypoint copies
              # these allowlisted NAME=value arguments into the environment.
              - "LAKEBASE_PROJECT_ID={{job.parameters.lakebase_project_id}}"
              - "LAKEBASE_ENDPOINT={{job.parameters.lakebase_endpoint}}"
              - "LAKEBASE_DATABASE_NAME={{job.parameters.lakebase_database_name}}"
              - "LAKEBASE_SCHEMA={{job.parameters.lakebase_schema_name}}"
              - "SERVING_ENDPOINT_ADAPTER={{job.parameters.inference_adapter}}"
              - "SERVING_COLD_START_MAX_RETRIES={{job.parameters.serving_cold_start_max_retries}}"
              - "SERVING_COLD_START_INITIAL_DELAY_S={{job.parameters.serving_cold_start_initial_delay_s}}"
              - "SERVING_COLD_START_MAX_DELAY_S={{job.parameters.serving_cold_start_max_delay_s}}"
              - "SERVING_COLD_START_JOB_BUDGET_S={{job.parameters.serving_cold_start_job_budget_s}}"
              - "PRE_ANNOTATE_JOB_BATCH_SIZE={{job.parameters.preannotate_job_batch_size}}"
              - "PRE_ANNOTATE_MAX_CONSECUTIVE_UNAVAILABLE={{job.parameters.preannotate_max_consecutive_unavailable}}"
      environments:
        - environment_key: preann_env
          spec:
            environment_version: "5"
            dependencies:
              - sqlalchemy>=2.0.0
              - psycopg2-binary>=2.9.0
              - databricks-sdk>=0.151.0
              - Pillow>=10.0.0
              - pydantic>=2.0.0
