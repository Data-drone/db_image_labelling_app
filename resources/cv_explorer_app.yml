# Databricks App with declarative resources (visible in Apps UI).
# App source is the bundle upload (workspace .bundle/.../files), not live Git — run
# `databricks bundle deploy` after code changes. (Git-backed deploy can race before /app is populated.)
# source_code_path is relative to this file's directory (resources/); ".." is the repo root with backend/, start.py, requirements.txt.
# app.yml in repo documents env for manual Git-only apps.

resources:
  apps:
    cv_explorer_app:
      name: ${var.app_name}
      description: Image labeling and annotation for CV manufacturing datasets
      source_code_path: ..
      config:
        command: ["python", "start.py"]
        env:
          - name: LAKEBASE_AUTO_PROVISION
            value: "false"
          - name: USE_LAKEBASE
            value: "true"
          - name: DEMO_VOLUME_PATH
            value_from: demo-volume
          - name: SERVING_ENDPOINT
            value_from: serving-endpoint
          - name: SERVING_ENDPOINT_ADAPTER
            value: "sam31"
          - name: USE_SERVING_DATA_PLANE
            value: "true"
          - name: PRE_ANNOTATE_DATABRICKS_JOB_ID
            value_from: app-preannotate-job
          - name: EXPORT_VOLUME_PATH
            value_from: export-volume
          - name: FINETUNE_DATABRICKS_JOB_ID
            value_from: app-finetune-job
      resources:
        - name: lakebase-db
          postgres:
            branch: ${var.lakebase_postgres_branch}
            database: ${var.lakebase_postgres_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: demo-volume
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.demo_volume_full_name}
            permission: READ_VOLUME
        - name: export-volume
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.export_volume_full_name}
            permission: WRITE_VOLUME
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY
        - name: app-preannotate-job
          job:
            id: ${resources.jobs.cv_explorer_preannotate.id}
            permission: CAN_MANAGE_RUN
        - name: app-finetune-job
          job:
            id: ${var.finetune_job_id}
            permission: CAN_MANAGE_RUN
