# Declarative Automation Bundle — CV Explorer app + async pre-annotate job.
# Validate: databricks bundle validate
# Deploy:   databricks bundle deploy --target dev

bundle:
  name: cv_explorer

include:
  - resources/*.yml

sync:
  exclude:
    - .isaac/**
    - tmp/**
    # Apps runtime does not run npm; never upload local install trees.
    - frontend/node_modules/**

variables:
  # App resources (override if your workspace differs)
  # Override for your workspace, e.g. brian_gen_ai.cv_explorer.demo_images
  demo_volume_full_name:
    default: classic_stable_hdtwu7_catalog.cv_manufacturing.labeling
  export_volume_full_name:
    default: classic_stable_hdtwu7_catalog.cv_manufacturing.labeling
  lakebase_postgres_branch:
    default: projects/cv-explorer/branches/production
  lakebase_postgres_database:
    default: projects/cv-explorer/branches/production/databases/cv-explorer-db
  lakebase_postgres_endpoint:
    default: projects/cv-explorer/branches/production/endpoints/primary
  lakebase_database_name:
    default: databricks_postgres
  lakebase_schema_name:
    default: cv_explorer_app
  lakebase_migrate_public:
    default: "false"
  # SDK lookup if PG* is not injected. Must match the postgres resource above,
  # not DATABRICKS_APP_NAME (cv-explorer-dev).
  lakebase_project_id:
    default: cv-explorer
  serving_endpoint_name:
    default: cv-sam31-cv_manufacturing
  inference_adapter:
    default: sam31
  serving_cold_start_max_retries:
    default: "3"
  serving_cold_start_initial_delay_s:
    default: "5"
  serving_cold_start_max_delay_s:
    default: "60"
  serving_cold_start_interactive_budget_s:
    default: "45"
  serving_cold_start_job_budget_s:
    default: "900"
  embedding_endpoint_name:
    default: cv-dinov3-cv_manufacturing
  finetune_job_id:
    default: "318435402424260"
  app_name:
    default: cv-explorer-dev
  # Comma-separated Databricks IdP emails allowed to invoke destructive Admin
  # operations. The non-email default is fail-closed and remains a valid Apps
  # environment value.
  admin_emails:
    default: "__disabled__"
  # SQL warehouse the app uses to SELECT image_path from UC tables. Empty skips
  # table-backed project create until set (Apps UI or this variable).
  sql_warehouse_id:
    default: "1e90aa7a436a41d9"
targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://fevm-classic-stable-hdtwu7.cloud.databricks.com
      # Pick the ~/.databrickscfg stanza for this host (you had both fevm-classic-stable and dev).
      profile: fevm-classic-stable

  prod:
    mode: production
    variables:
      app_name: cv-explorer-prod
